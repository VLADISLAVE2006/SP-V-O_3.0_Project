components:
  schemas:
    AccessModeEnum:
      enum:
      - anonymous
      - registered
      type: string
      description: |-
        * `anonymous` - anonymous
        * `registered` - registered
    AuthResult:
      type: object
      properties:
        access:
          type: string
        refresh:
          type: string
        profile:
          $ref: '#/components/schemas/Profile'
      required:
      - access
      - profile
      - refresh
    AvatarRequest:
      type: object
      properties:
        avatar:
          type: string
          format: binary
      required:
      - avatar
    Ban:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        user_id:
          type: integer
          readOnly: true
        banned_by:
          type: integer
          nullable: true
        is_auto:
          type: boolean
        reason:
          type: string
          nullable: true
          maxLength: 500
        banned_at:
          type: string
          format: date-time
          readOnly: true
        unbanned_at:
          type: string
          format: date-time
          nullable: true
      required:
      - banned_at
      - id
      - user_id
    BanInputRequest:
      type: object
      properties:
        reason:
          type: string
          nullable: true
          maxLength: 500
    BanPage:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Ban'
        total:
          type: integer
        has_more:
          type: boolean
      required:
      - has_more
      - items
      - total
    Comment:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        poll_id:
          type: integer
          readOnly: true
        author:
          $ref: '#/components/schemas/PublicUser'
        parent_id:
          type: integer
          nullable: true
          readOnly: true
        text:
          type: string
          maxLength: 1000
        likes_count:
          type: integer
          maximum: 2147483647
          minimum: -2147483648
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - author
      - created_at
      - id
      - parent_id
      - poll_id
      - text
      - updated_at
    CommentInputRequest:
      type: object
